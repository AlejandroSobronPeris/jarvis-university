function fim(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const ev=parse(String(r.result));if(!ev.length){alert('No he encontrado eventos en ese archivo.');return}const s=ev[0].s,ts=new Date().toISOString(),q=e=>e.s||(st.demo?'d':'a'),old=st.ev.filter(e=>q(e)==s),keep=st.ev.filter(e=>s=='a'?(q(e)!='a'&&q(e)!='d'):q(e)!=s),om={},nm={};old.forEach(e=>om[e.id]=e);ev.forEach(e=>nm[e.id]=e);if(s=='a'&&old.length){ev.forEach(e=>{const p=om[e.id];if(!p)st.log.unshift({ts,m:'Nuevo: '+lab(e)+' · '+e.cn+' · '+fdate(e.t)});else if(p.t!=e.t&&isT(e))st.log.unshift({ts,m:'Cambio de fecha: '+lab(e)+' → '+fdate(e.t)})});old.forEach(p=>{if(!nm[p.id]&&new Date(p.t)>Date.now())st.log.unshift({ts,m:'Eliminada: '+lab(p)})})}else st.log.unshift({ts,m:(s=='h'?'Horario de clases importado: ':'Calendario del Aula Virtual importado: ')+ev.length+' eventos'});st.log=st.log.slice(0,60);if(s=='a'&&st.demo)['auto','quim'].forEach(k=>delete st.co[k]);ev.forEach(e=>{const o=st.co[e.c]||{};st.co[e.c]={n:e.cn,code:e.cd,g:e.cg||o.g||''}});st.ev=keep.concat(ev.map(e=>({id:e.id,t:e.t,e:e.e,c:e.c,k:e.k,n:e.n,d:e.d,s:e.s})));if(s=='a')st.demo=false;['co','ev','demo','log'].forEach(sv);render()};r.readAsText(f)}

function im(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);Object.keys(DEF).forEach(k=>{if(k in o){st[k]=o[k];sv(k)}});render()}catch(e){alert('El archivo no es una copia válida.')}};r.readAsText(f)}
let CL=S.g('cloud',{url:'',key:'',tok:'',ref:'',uid:'',email:''}),SM='',IP=null;
const cloudOn=()=>!!(CL.url&&CL.key&&CL.tok),sm=m=>{SM=m;const e=document.getElementById('sbm');if(e)e.textContent=m};
async function cf(path,o={},au=true){const h=Object.assign({apikey:CL.key,'Content-Type':'application/json'},au?{Authorization:'Bearer '+CL.tok}:{},o.h||{});const r=await fetch(CL.url.replace(/\/+$/,'')+path,{method:o.m||'GET',headers:h,body:o.b?JSON.stringify(o.b):undefined});if(r.status==401&&au&&CL.ref&&!o.rt){await rfr();return cf(path,Object.assign({},o,{rt:1}),au)}const t=await r.text();if(!r.ok)throw new Error(t.slice(0,160));return t?JSON.parse(t):null}
function setSess(j){CL.tok=j.access_token;CL.ref=j.refresh_token;CL.uid=j.user.id;CL.email=j.user.email;S.s('cloud',CL)}
async function rfr(){setSess(await cf('/auth/v1/token?grant_type=refresh_token',{m:'POST',b:{refresh_token:CL.ref}},false))}
async function cAuth(kind){const g=i=>document.getElementById(i).value.trim();CL.url=g('sbu');CL.key=g('sbk');const em=g('sbe'),pw=document.getElementById('sbp').value;if(!/^https:\/\//.test(CL.url)||!CL.key||!em||pw.length<8){sm('Completa los cuatro campos (contraseña de 8 o más caracteres).');return}try{sm('Conectando…');const j=await cf(kind=='signup'?'/auth/v1/signup':'/auth/v1/token?grant_type=password',{m:'POST',b:{email:em,password:pw}},false);if(!j.access_token){S.s('cloud',CL);sm('Cuenta creada. Confirma tu correo y pulsa Entrar.');return}setSess(j);await syncNow();render()}catch(e){sm('Error: '+e.message)}}
async function push(){const ts=new Date().toISOString(),o={};Object.keys(DEF).forEach(k=>o[k]=st[k]);await cf('/rest/v1/jarvis_data',{m:'POST',h:{Prefer:'resolution=merge-duplicates,return=minimal'},b:{user_id:CL.uid,data:o,updated_at:ts}});S.s('upd',ts);S.s('dirty',false)}
async function syncNow(){if(!cloudOn())return;try{sm('Sincronizando…');const r=await cf('/rest/v1/jarvis_data?select=data,updated_at&user_id=eq.'+CL.uid);if(r.length&&new Date(r[0].updated_at)>new Date(S.g('upd','1970-01-01'))&&!S.g('dirty',false)){const o=r[0].data;Object.keys(DEF).forEach(k=>{if(k in o){st[k]=o[k];S.s(k,o[k])}});S.s('upd',r[0].updated_at);render()}else await push();sm('Sincronizado a las '+fd(new Date().toISOString(),{hour:'2-digit',minute:'2-digit'}))}catch(e){sm('Error: '+e.message)}}
function cOut(){CL.tok=CL.ref=CL.uid=CL.email='';S.s('cloud',CL);render()}
addEventListener('visibilitychange',()=>{if(!document.hidden)syncNow()});addEventListener('online',syncNow);setInterval(syncNow,12e4);
addEventListener('beforeinstallprompt',e=>{e.preventDefault();IP=e;const b=document.getElementById('inst');if(b)b.hidden=false});

let P={m:'w',left:1500,run:false,end:0,cy:1};const pdur=()=>st.pcfg[P.m]*60;
function pSet(){P.left=pdur();P.run=false}function pTog(){if(P.run){P.left=Math.max(0,Math.round((P.end-Date.now())/1000));P.run=false}else{P.end=Date.now()+P.left*1000;P.run=true}pp()}function pRes(){P.m='w';P.cy=1;pSet();pp()}
function pDone(){const c=st.pcfg;if(P.m=='w'){const d=today(),k=PC||'—';st.stats.days[d]=st.stats.days[d]||{};st.stats.days[d][k]=(st.stats.days[d][k]||0)+c.w;st.stats.ses++;sv('stats');P.m=P.cy%c.n==0?'l':'s';P.cy++}else P.m='w';pSet();try{const a=new AudioContext(),o=a.createOscillator();o.connect(a.destination);o.start();o.stop(a.currentTime+.4)}catch(e){}if(view=='productividad')render();else pp()}
function pp(){const t=document.getElementById('pt');if(!t)return;const m=String(Math.floor(P.left/60)).padStart(2,'0'),s=String(P.left%60).padStart(2,'0');t.textContent=m+':'+s;document.getElementById('pa').style.strokeDashoffset=477.5*(1-P.left/pdur());document.getElementById('pb').textContent=P.run?'Pausar':'Iniciar';document.getElementById('pm').textContent={w:'Estudio',s:'Descanso corto',l:'Descanso largo'}[P.m];document.getElementById('pcy').textContent='Ciclo '+((P.cy-1)%st.pcfg.n+1)+' de '+st.pcfg.n}
setInterval(()=>{if(P.run){const l=Math.round((P.end-Date.now())/1000);if(l<=0)pDone();else{P.left=l;pp()}}},500);pSet();
function render(){nav.innerHTML='<div class="logo sg">JARVIS<small>UNIVERSITY</small></div>'+NAV.map(n=>`<a class="${view==n[0]?'on':''}" onclick="go('${n[0]}')"><span>${n[2]}</span>${n[1]}${n[0]=='tareas'&&up().length?`<span class="bdg">${up().length}</span>`:''}</a>`).join('');if(!V[view])view='inicio';document.getElementById('ttl').textContent=NAV.find(n=>n[0]==view)[1];document.getElementById('dt').textContent=fd(new Date().toISOString(),{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})+' (hora de Madrid)';document.getElementById('v').innerHTML=V[view]();if(view=='productividad')pp()}
